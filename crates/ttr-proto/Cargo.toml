[package]
name = "ttr-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CiufCiuf! — tipi del contratto WebSocket condivisi tra server e client (serde + ts-rs)"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "10", # ts-rs non interpreta `skip_serializing_if`: senza questa feature stampa un avviso per attributo.
features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
serde_json = "1"