[package]
name = "ttr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CiufCiuf! — motore di gioco puro, deterministico, map-agnostic"

[[bin]]
name = "ttr-cli"
path = "src/bin/ttr-cli.rs"

[dependencies]
ttr-proto = { path = "../ttr-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
rand = "0.8"
ttr-proto = { path = "../ttr-proto" }