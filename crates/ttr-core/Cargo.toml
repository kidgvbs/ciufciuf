[package]
name = "ttr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CiufCiuf! — motore di gioco puro, deterministico, map-agnostic"

[features]
# Espone gli helper che modificano lo stato interno, usati solo dai test.
test-helpers = []

[[bin]]
name = "ttr-cli"
path = "src/bin/ttr-cli.rs"

[dependencies]
ttr-proto = { path = "../ttr-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# versioni bloccate: lo shuffle determina il replay dei save
rand = "=0.8.8"
rand_chacha = "=0.3.1"
thiserror = "2"

[dev-dependencies]
ttr-core = { path = ".", features = ["test-helpers"] }
serde_json = "1"
rand = "=0.8.8"
ttr-proto = { path = "../ttr-proto" }
proptest = "1.12.0"
